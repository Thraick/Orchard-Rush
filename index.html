<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#14351f" />
    <title>Orchard Rush</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
      }
      body {
        font-family: "Fredoka", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
        background: radial-gradient(circle at 50% 0%, #2f5d3a 0%, #17351f 45%, #0a1a10 100%);
        background-attachment: fixed;
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        min-height: 100dvh;
        overflow-x: hidden;
        user-select: none;
      }
      .hidden {
        display: none !important;
      }
      button {
        font-family: inherit;
      }

      /* Screens */
      .screen {
        width: 100%;
        max-width: 560px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 12px 12px 18px;
      }
      .home {
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
      }
      .game {
        min-height: 100vh;
        min-height: 100dvh;
      }

      /* Pills / buttons */
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        background: rgba(255, 255, 255, 0.09);
        border: 1px solid rgba(255, 255, 255, 0.14);
        padding: 6px 11px;
        border-radius: 999px;
        font-weight: 700;
        font-size: 13px;
      }
      .pill.coin {
        color: #ffd166;
        background: rgba(255, 209, 102, 0.13);
        border-color: rgba(255, 209, 102, 0.32);
      }
      .icon-btn {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.16);
        color: #fff;
        font-size: 16px;
        width: 38px;
        height: 38px;
        border-radius: 12px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition: background 0.15s, transform 0.1s;
      }
      .icon-btn:hover {
        background: rgba(255, 255, 255, 0.2);
      }
      .icon-btn:active {
        transform: scale(0.94);
      }

      /* Home top */
      .home-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 6px 0 2px;
      }
      .profile-btn {
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 999px;
        padding: 5px 12px 5px 6px;
        color: #fff;
        cursor: pointer;
        font-weight: 700;
        font-size: 14px;
        max-width: 60%;
      }
      .profile-btn .avatar {
        font-size: 20px;
        width: 30px;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 50%;
      }
      .profile-btn .name {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .home-right {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .level-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        padding: 0 2px;
      }
      .level-head h1 {
        margin: 0;
        font-size: 24px;
        letter-spacing: 0.4px;
        background: linear-gradient(180deg, #d9ff9a, #7bd66a);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .level-head span {
        font-size: 12px;
        opacity: 0.7;
        font-weight: 700;
      }

      /* Leaderboard */
      .lb-card {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 10px;
      }
      .lb-tabs {
        display: flex;
        gap: 6px;
        margin-bottom: 8px;
      }
      .lb-tabs button {
        flex: 1;
        padding: 7px 4px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.04);
        color: #fff;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
      }
      .lb-tabs button.active {
        background: rgba(123, 214, 106, 0.22);
        border-color: rgba(123, 214, 106, 0.5);
      }
      .lb-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
        max-height: 150px;
        overflow-y: auto;
      }
      .lb-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.03);
        cursor: pointer;
        font-size: 12px;
      }
      .lb-row:hover {
        background: rgba(255, 255, 255, 0.1);
      }
      .lb-row.me {
        background: rgba(123, 214, 106, 0.16);
        border: 1px solid rgba(123, 214, 106, 0.4);
      }
      .lb-rank {
        width: 20px;
        text-align: center;
        font-weight: 700;
        color: #ffd166;
      }
      .lb-av {
        font-size: 16px;
      }
      .lb-name {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 600;
      }
      .lb-flag {
        font-size: 13px;
      }
      .lb-score {
        font-weight: 700;
        color: #cdebb0;
      }
      .lb-note {
        font-size: 9px;
        opacity: 0.45;
        text-align: right;
        margin-top: 4px;
      }

      /* Level grid */
      .home-scroll {
        flex: 1;
        min-height: 90px;
        overflow-y: auto;
        padding: 2px;
      }
      .level-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
      }
      .level-btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        padding: 10px 2px;
        border-radius: 14px;
        cursor: pointer;
        color: #fff;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.04));
        border: 1px solid rgba(255, 255, 255, 0.16);
        aspect-ratio: 1 / 1;
        transition: 0.15s;
      }
      .level-btn:hover {
        background: rgba(255, 255, 255, 0.18);
        transform: translateY(-2px);
      }
      .level-btn.locked {
        opacity: 0.32;
        cursor: not-allowed;
        filter: grayscale(0.7);
      }
      .level-btn.done {
        border-color: #ffd166;
        box-shadow: 0 0 12px rgba(255, 209, 102, 0.3);
      }
      .level-num {
        font-size: 15px;
        font-weight: 700;
        color: #cdebb0;
      }
      .level-stars {
        font-size: 8px;
        letter-spacing: 1px;
        color: #ffd166;
      }
      .level-stars .off {
        color: rgba(255, 255, 255, 0.2);
      }
      .page-nav {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }
      .page-nav button {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.16);
        color: #fff;
        width: 38px;
        height: 34px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 14px;
      }
      .page-nav button:disabled {
        opacity: 0.3;
      }
      .page-nav span {
        font-size: 12px;
        font-weight: 700;
        opacity: 0.8;
        min-width: 90px;
        text-align: center;
      }
      .cta {
        width: 100%;
        padding: 13px;
        border-radius: 14px;
        border: none;
        cursor: pointer;
        font-weight: 700;
        font-size: 15px;
        color: #14351f;
        background: linear-gradient(180deg, #d9ff9a, #7bd66a);
        box-shadow: 0 4px 0 #4f9b45;
      }
      .cta:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 #4f9b45;
      }

      /* Game top */
      .topbar {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .badge {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 6px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        padding: 7px 10px;
        min-width: 0;
        font-weight: 700;
        font-size: 13px;
      }
      .badge span:last-child {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .hud-pills {
        display: flex;
        gap: 5px;
        flex-shrink: 0;
      }
      .hud-pills .pill {
        padding: 6px 8px;
        font-size: 12px;
      }

      /* Hype */
      .hype {
        width: 100%;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 6px 10px;
      }
      .hype-label {
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        letter-spacing: 1px;
        text-transform: uppercase;
        opacity: 0.7;
        margin-bottom: 4px;
      }
      .hype-bar {
        height: 6px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.1);
        overflow: hidden;
      }
      .hype-bar > div {
        height: 100%;
        width: 0%;
        border-radius: 3px;
        background: linear-gradient(90deg, #ffe08a, #ff9d5c, #ff5c8a);
        transition: width 0.2s;
      }

      /* Boss */
      .boss {
        width: 100%;
        background: rgba(255, 90, 90, 0.1);
        border: 1px solid rgba(255, 90, 90, 0.4);
        border-radius: 12px;
        padding: 8px 10px;
      }
      .boss-info {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        font-weight: 700;
        margin-bottom: 4px;
      }
      .boss-bar {
        height: 8px;
        border-radius: 4px;
        background: rgba(0, 0, 0, 0.3);
        overflow: hidden;
      }
      .boss-bar > div {
        height: 100%;
        width: 100%;
        background: linear-gradient(90deg, #ff8888, #cc3333);
        transition: width 0.25s;
      }
      .boss-need {
        font-size: 10px;
        opacity: 0.8;
        margin-top: 4px;
      }

      /* Missions as bubbles */
      .missions {
        width: 100%;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        min-height: 28px;
        align-items: center;
      }
      .mission {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 11px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.12);
        font-size: 12px;
        line-height: 1;
      }
      .mission::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #ffd166;
        box-shadow: 0 0 6px rgba(255, 209, 102, 0.7);
        flex-shrink: 0;
      }
      .mission.done {
        background: rgba(123, 214, 106, 0.16);
        border-color: rgba(123, 214, 106, 0.45);
      }
      .mission.done::before {
        background: #7bd66a;
        box-shadow: 0 0 8px rgba(123, 214, 106, 0.9);
      }
      .mission-icon {
        font-size: 14px;
      }
      .mission-count {
        font-weight: 700;
        color: #ffd166;
      }
      .mission.done .mission-count {
        color: #7bd66a;
      }

      /* Stage / board */
      .stage {
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 1;
        padding: 4px 0;
      }
      .board-frame {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
        border-radius: 22px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.02));
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
        transition: transform 0.35s ease;
      }
      #board {
        position: relative;
        border-radius: 18px;
        --tile: 56px;
        z-index: 0;
        background: rgba(0, 0, 0, 0.22);
        box-shadow: inset 0 0 34px rgba(0, 0, 0, 0.45);
        touch-action: none;
      }
      #board.no-anim .tile {
        transition: none !important;
      }
      #board.shake {
        animation: shakeBoard 0.42s ease;
      }
      @keyframes shakeBoard {
        0%, 100% { transform: translate(0, 0); }
        20% { transform: translate(-5px, 3px); }
        40% { transform: translate(5px, -3px); }
        60% { transform: translate(-3px, -4px); }
        80% { transform: translate(3px, 4px); }
      }
      #board.reduce-motion.shake {
        animation: none;
      }

      /* Tiles */
      .tile {
        position: absolute;
        top: 0;
        left: 0;
        width: var(--tile);
        height: var(--tile);
        z-index: 1;
        transition: transform 0.22s cubic-bezier(0.2, 0.8, 0.3, 1);
        will-change: transform;
        cursor: pointer;
      }
      .tile .inner {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: calc(var(--tile) * 0.72);
        border-radius: calc(var(--tile) * 0.26);
        transition: transform 0.16s ease, opacity 0.16s ease, filter 0.16s ease;
        background: transparent !important;
        filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.55))
          drop-shadow(0 0 10px rgba(255, 255, 255, 0.16));
      }
      .tile.sel .inner {
        transform: scale(1.15);
        filter: drop-shadow(0 0 10px #fff) drop-shadow(0 0 22px rgba(255, 255, 255, 0.9));
      }
      .tile.pop .inner {
        transform: scale(0) rotate(90deg);
        opacity: 0;
      }
      .tile.spin .inner {
        animation: spin 0.4s ease;
      }
      @keyframes spin {
        0% { transform: rotate(0) scale(1); }
        50% { transform: rotate(180deg) scale(0.65); }
        100% { transform: rotate(360deg) scale(1); }
      }
      .tile.hint .inner {
        animation: hintPulse 1s ease-in-out infinite;
      }
      @keyframes hintPulse {
        0%, 100% { transform: scale(1); }
        50% {
          transform: scale(1.15);
          filter: drop-shadow(0 0 10px #7bd66a) drop-shadow(0 0 22px rgba(123, 214, 106, 0.9));
        }
      }

      /* Specials */
      .tile.special .inner {
        animation: specialPulse 1.4s ease-in-out infinite;
        font-size: calc(var(--tile) * 0.66);
        color: #fff;
      }
      @keyframes specialPulse {
        0%, 100% { filter: drop-shadow(0 0 8px #ffd166) drop-shadow(0 0 18px rgba(255, 209, 102, 0.75)); }
        50% { filter: drop-shadow(0 0 16px #fff) drop-shadow(0 0 30px rgba(255, 255, 255, 0.95)); }
      }
      .tile.sp-bomb .inner {
        filter: drop-shadow(0 0 12px #ff4444) drop-shadow(0 0 24px rgba(255, 60, 60, 0.7));
      }
      .tile.sp-rainbow .inner {
        animation: rainbowGlow 2.5s linear infinite;
      }
      @keyframes rainbowGlow {
        0% { filter: drop-shadow(0 0 12px #ff6b6b) drop-shadow(0 0 24px #ff6b6b); }
        25% { filter: drop-shadow(0 0 12px #ffd166) drop-shadow(0 0 24px #ffd166); }
        50% { filter: drop-shadow(0 0 12px #7bd66a) drop-shadow(0 0 24px #7bd66a); }
        75% { filter: drop-shadow(0 0 12px #4d96ff) drop-shadow(0 0 24px #4d96ff); }
        100% { filter: drop-shadow(0 0 12px #ff6b6b) drop-shadow(0 0 24px #ff6b6b); }
      }

      /* Frost (frosted fruit) */
      .frost-overlay {
        position: absolute;
        inset: 0;
        border-radius: calc(var(--tile) * 0.26);
        pointer-events: none;
        z-index: 5;
        background:
          radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.9) 0%, rgba(220, 245, 255, 0.35) 30%, transparent 55%),
          linear-gradient(135deg, rgba(235, 250, 255, 0.55), rgba(150, 205, 235, 0.45));
        box-shadow: inset 0 0 14px rgba(255, 255, 255, 0.75), 0 0 10px rgba(180, 230, 255, 0.5);
        backdrop-filter: blur(1px);
      }
      .frost-overlay::after {
        content: "❄";
        position: absolute;
        right: 8%;
        bottom: 6%;
        font-size: calc(var(--tile) * 0.22);
        color: rgba(255, 255, 255, 0.9);
        text-shadow: 0 0 6px rgba(180, 230, 255, 0.9);
      }
      .frost-overlay.shattering {
        animation: shatterAnim 0.35s ease-out forwards;
      }
      @keyframes shatterAnim {
        0% { transform: scale(1) rotate(0); opacity: 1; }
        100% { transform: scale(1.4) rotate(20deg); opacity: 0; }
      }
      .tile.frozen-locked .inner {
        filter: brightness(0.9) saturate(0.8);
      }
      .tile.frozen-locked {
        cursor: not-allowed;
      }

      /* Ripen cells */
      .ripen-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 0;
      }
      .ripen-cell {
        position: absolute;
        border-radius: 12px;
        background: radial-gradient(circle at 50% 40%, rgba(255, 230, 120, 0.5), rgba(150, 210, 90, 0.25));
        border: 1px solid rgba(200, 240, 140, 0.5);
        box-shadow: inset 0 0 10px rgba(200, 255, 150, 0.4);
      }
      .ripen-cell.pop {
        animation: ripenPop 0.3s ease forwards;
      }
      @keyframes ripenPop {
        to { opacity: 0; transform: scale(1.4); }
      }

      /* Blight cells */
      .blight-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 0;
      }
      .blight-cell {
        position: absolute;
        border-radius: 12px;
        background: radial-gradient(circle at 50% 50%, rgba(90, 60, 30, 0.65), rgba(40, 20, 10, 0.85));
        border: 1px solid rgba(120, 80, 40, 0.8);
      }

      /* Portal + chain overlays */
      .portal-layer,
      .chain-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        overflow: visible;
      }
      .portal-cell {
        position: absolute;
        border-radius: 50%;
        border: 2px dashed rgba(180, 140, 255, 0.9);
        box-shadow: 0 0 14px rgba(180, 140, 255, 0.8), inset 0 0 12px rgba(180, 140, 255, 0.6);
        animation: portalSpin 3s linear infinite;
      }
      @keyframes portalSpin {
        to { transform: rotate(360deg); }
      }
      .chain-line {
        stroke: rgba(255, 240, 150, 0.9);
        stroke-width: 3;
        stroke-dasharray: 6 4;
        filter: drop-shadow(0 0 4px rgba(255, 240, 150, 0.8));
        animation: chainPulse 1.2s linear infinite;
      }
      @keyframes chainPulse {
        to { stroke-dashoffset: -20; }
      }

      /* Particles / floats */
      .particle {
        position: absolute;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        pointer-events: none;
        z-index: 6;
        transform: translate(-50%, -50%);
      }
      #board.reduce-motion .particle {
        display: none;
      }
      .float {
        position: absolute;
        pointer-events: none;
        font-weight: 700;
        font-size: 18px;
        color: #ffe066;
        text-shadow: 0 2px 6px rgba(0, 0, 0, 0.85);
        transform: translate(-50%, -50%);
        animation: floatUp 0.8s ease-out forwards;
        z-index: 5;
      }
      @keyframes floatUp {
        0% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
        25% { opacity: 1; transform: translate(-50%, -95%) scale(1.15); }
        100% { opacity: 0; transform: translate(-50%, -230%) scale(1); }
      }
      .combo {
        position: absolute;
        transform: translate(-50%, -50%);
        font-size: 26px;
        font-weight: 700;
        color: #d9ff9a;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9), 0 0 20px rgba(123, 214, 106, 0.8);
        animation: comboAnim 0.9s ease-out forwards;
        pointer-events: none;
        z-index: 10;
      }
      @keyframes comboAnim {
        0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
        30% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
        100% { opacity: 0; transform: translate(-50%, -80%) scale(1); }
      }

      /* Skill dock */
      .dock {
        width: 100%;
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 4px 2px 2px;
        margin-top: auto;
        scrollbar-width: none;
      }
      .dock::-webkit-scrollbar {
        display: none;
      }
      .skill {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
        padding: 8px 6px;
        border-radius: 14px;
        cursor: pointer;
        color: #fff;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.05));
        border: 1px solid rgba(255, 255, 255, 0.16);
        min-width: 66px;
        flex: 0 0 auto;
      }
      .skill:hover {
        background: rgba(255, 255, 255, 0.2);
      }
      .skill:active {
        transform: scale(0.96);
      }
      .skill .sk-icon {
        font-size: 20px;
        line-height: 1;
        color: #ffd166;
      }
      .skill .sk-name {
        font-size: 10px;
        opacity: 0.85;
        text-align: center;
        line-height: 1;
      }
      .skill .sk-cost {
        font-size: 10px;
        font-weight: 700;
        color: #ffd166;
      }

          const ta = grid[a.r][a.c],
            tb = grid[b.r][b.c];
          if (ta && !tb) {
            grid[b.r][b.c] = ta;
            grid[a.r][a.c] = null;
            setPos(ta, b.r, b.c);
          } else if (tb && !ta) {
            grid[a.r][a.c] = tb;
            grid[b.r][b.c] = null;
            setPos(tb, a.r, a.c);
          }
        }
        fillHoles();
      }
      async function settle(fast) {
        const dir = state.gravity;
        if (dir === "down") {
          for (let c = 0; c < COLS; c++) {
            let write = ROWS - 1;
            for (let r = ROWS - 1; r >= 0; r--)
              if (grid[r][c]) {
                if (r !== write) {
                  grid[write][c] = grid[r][c];
                  grid[r][c] = null;
                  setPos(grid[write][c], write, c);
                }
                write--;
              }
            for (let r = write; r >= 0; r--) grid[r][c] = createTile(spawnType(), r, c, r - ROWS, c);
          }
        } else if (dir === "up") {
          for (let c = 0; c < COLS; c++) {
            let write = 0;
            for (let r = 0; r < ROWS; r++)
              if (grid[r][c]) {
                if (r !== write) {
                  grid[write][c] = grid[r][c];
                  grid[r][c] = null;
                  setPos(grid[write][c], write, c);
                }
                write++;
              }
            for (let r = write; r < ROWS; r++) grid[r][c] = createTile(spawnType(), r, c, r + ROWS, c);
          }
        } else if (dir === "left") {
          for (let r = 0; r < ROWS; r++) {
            let write = 0;
            for (let c = 0; c < COLS; c++)
              if (grid[r][c]) {
                if (c !== write) {
                  grid[r][write] = grid[r][c];
                  grid[r][c] = null;
                  setPos(grid[r][write], r, write);
                }
                write++;
              }
            for (let c = write; c < COLS; c++) grid[r][c] = createTile(spawnType(), r, c, r, c + COLS);
          }
        } else if (dir === "right") {
          for (let r = 0; r < ROWS; r++) {
            let write = COLS - 1;
            for (let c = COLS - 1; c >= 0; c--)
              if (grid[r][c]) {
                if (c !== write) {
                  grid[r][write] = grid[r][c];
                  grid[r][c] = null;
                  setPos(grid[r][write], r, write);
                }
                write--;
              }
            for (let c = write; c >= 0; c--) grid[r][c] = createTile(spawnType(), r, c, r, c - COLS);
          }
        }
        applyPortals();
        await sleep(state.settings.reduceMotion || fast ? 70 : 240);
      }

      /* ================= Removal / resolve ================= */
      async function removeTiles(list, fast) {
        const els = [];
        for (const [r, c] of list) {
          const t = grid[r][c];
          if (t) {
            grid[r][c] = null;
            t.el.classList.add("pop");
            els.push(t.el);
          }
        }
        await sleep(state.settings.reduceMotion || fast ? 60 : 170);
        els.forEach((el) => el.remove());
        renderOverlays();
      }
      function applyFrostDamage(touched) {
        const hits = new Set(),
          prot = new Set();
        for (const key of touched) {
          const [r, c] = key.split(",").map(Number);
          const t = grid[r][c];
          if (t && t.frost > 0) {
            prot.add(key);
            hits.add(key);
          }
          for (let dr = -1; dr <= 1; dr++)
            for (let dc = -1; dc <= 1; dc++) {
              if (dr === 0 && dc === 0) continue;
              const nr = r + dr,
                nc = c + dc;
              if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) continue;
              const nt = grid[nr][nc];
              if (nt && nt.frost > 0) hits.add(nr + "," + nc);
            }
        }
        const shattered = new Set();
        let broke = false;
        for (const key of hits) {
          const [r, c] = key.split(",").map(Number);
          const t = grid[r][c];
          if (!t) continue;
          t.frost--;
          if (t.frost <= 0) {
            shattered.add(key);
            broke = true;
          } else renderFrost(t);
        }
        if (broke) sfx.frost();
        return { prot, shattered };
      }
      function burstParticles(r, c, n) {
        if (state.settings.reduceMotion) return;
        const cx = c * (TILE + GAP) + TILE / 2,
          cy = r * (TILE + GAP) + TILE / 2;
        for (let i = 0; i < n; i++) {
          const p = document.createElement("div");
          p.className = "particle";
          p.style.left = cx + "px";
          p.style.top = cy + "px";
          p.style.background = `hsl(${Math.random() * 360}, 85%, 65%)`;
          boardEl.appendChild(p);
          const angle = Math.random() * Math.PI * 2,
            dist = 24 + Math.random() * 60;
          p.animate(
            [
              { transform: "translate(-50%,-50%) scale(1)", opacity: 1 },
              { transform: `translate(calc(-50% + ${Math.cos(angle) * dist}px), calc(-50% + ${Math.sin(angle) * dist}px)) scale(0)`, opacity: 0 },
            ],
            { duration: 480 + Math.random() * 320, easing: "cubic-bezier(.2,.8,.3,1)" },
          );
          setTimeout(() => p.remove(), 850);
        }
      }
      function showFloat(cells, text) {
        let sr = 0,
          sc = 0,
          n = 0;
        for (const k of cells) {
          const [r, c] = k.split(",").map(Number);
          sr += r;
          sc += c;
          n++;
        }
        if (!n) return;
        const el = document.createElement("div");
        el.className = "float";
        el.textContent = text;
        el.style.left = (sc / n) * (TILE + GAP) + TILE / 2 + "px";
        el.style.top = (sr / n) * (TILE + GAP) + TILE / 2 + "px";
        boardEl.appendChild(el);
        setTimeout(() => el.remove(), 800);
      }
      function showCombo(n) {
        if (state.settings.reduceMotion) return;
        const el = document.createElement("div");
        el.className = "combo";
        el.textContent = `Cascade ×${n}`;
        el.style.left = "50%";
        el.style.top = "40%";
        boardEl.appendChild(el);
        setTimeout(() => el.remove(), 900);
      }
      function shakeScreen() {
        if (state.settings.reduceMotion) return;
        boardEl.classList.add("shake");
        setTimeout(() => boardEl.classList.remove("shake"), 440);
      }
      function hypeMultiplier() {
        return state.hype.tier;
      }
      async function resolve() {
        let cascade = 0;
        while (true) {
          const groups = findMatchGroups();
          if (!groups.length) break;
          cascade++;
          if (cascade > 18) break;
          if (cascade >= 2) showCombo(cascade);
          const toRemove = new Set(),
            toConvert = [],
            specialSet = new Set();
          const colorCounts = {};
          for (const g of groups)
            for (const [r, c] of g.cells) {
              toRemove.add(r + "," + c);
              const t = grid[r][c];
              if (t && t.type >= 0) colorCounts[t.type] = (colorCounts[t.type] || 0) + 1;
            }
          const horiz = new Set(),
            vert = new Set();
          for (const g of groups)
            for (const [r, c] of g.cells) (g.horizontal ? horiz : vert).add(r + "," + c);
          const rainPos = new Set();
          for (const k of horiz) if (vert.has(k)) rainPos.add(k);
          for (const k of rainPos) {
            if (specialSet.has(k)) continue;
            const [r, c] = k.split(",").map(Number);
            const t = grid[r][c];
            if (!t || t.frost > 0 || t.special) continue;
            specialSet.add(k);
            toConvert.push({ r, c, special: "rainbow" });
          }
          for (const g of groups) {
            let special = null,
              pos = null;
            if (g.square) {
              special = "bomb";
              pos = g.cells[0];
            } else if (g.cells.length >= 5) {
              const hasRain = g.cells.some(([r, c]) => rainPos.has(r + "," + c));
              if (!hasRain) {
                special = g.horizontal ? "row" : "col";
                pos = g.cells[Math.floor(g.cells.length / 2)];
              }
            } else if (g.cells.length === 4) {
              special = "bomb";
              pos = g.cells[Math.floor(g.cells.length / 2)];
            }
            if (special && pos) {
              const occupied = (rr, cc) => {
                const x = grid[rr][cc];
                return !x || x.special || x.frost > 0;
              };
              if (occupied(pos[0], pos[1])) pos = g.cells.find(([rr, cc]) => !occupied(rr, cc)) || null;
              if (!pos) continue;
              const key = pos[0] + "," + pos[1];
              if (!specialSet.has(key)) {
                specialSet.add(key);
                toConvert.push({ r: pos[0], c: pos[1], special });
              }
            }
          }
          for (const s of toConvert) toRemove.delete(s.r + "," + s.c);
          const { prot, shattered } = applyFrostDamage(toRemove);
          for (const k of prot) toRemove.delete(k);
          for (const k of shattered) {
            toRemove.add(k);
            state.frostCleared++;
          }
          expandLinks(toRemove);
          const triggered = new Set(),
            queue = [...toRemove];
          while (queue.length) {
            const key = queue.pop();
            const [r, c] = key.split(",").map(Number);
            const t = grid[r][c];
            if (!t || !t.special) continue;
            if (triggered.has(t.id)) continue;
            triggered.add(t.id);
            state.specialsTriggered++;
            burstParticles(r, c, 8);
            if (t.special === "bomb") sfx.burst();
            else if (t.special === "row" || t.special === "col") sfx.line();
            else if (t.special === "rainbow") sfx.rainbow();
            for (const [er, ec] of getSpecialTargets(t)) {
              const ek = er + "," + ec;
              if (!toRemove.has(ek) && grid[er][ec]) {
                toRemove.add(ek);
                queue.push(ek);
              }
            }
          }
          if (triggered.size) shakeScreen();
          let ripenC = 0,
            blightC = 0;
          for (const k of toRemove) {
            if (ripenSet.has(k)) {
              ripenSet.delete(k);
              ripenC++;
            }
            if (blightSet.has(k)) {
              blightSet.delete(k);
              blightC++;
            }
          }
          state.ripenCleared += ripenC;
          state.blightCleared += blightC;
          if (blightC) state.blightClearedThisTurn = true;
          for (const key of toRemove) {
            const [r, c] = key.split(",").map(Number);
            const t = grid[r][c];
            if (t && t.type >= 0) state.collected[t.type] = (state.collected[t.type] || 0) + 1;
          }
          if (state.boss) {
            let dmg = 0;
            for (const key of toRemove) {
              const [r, c] = key.split(",").map(Number);
              const t = grid[r][c];
              if (t && t.type === state.boss.target) dmg += 3;
            }
            if (dmg) {
              state.boss.hp = Math.max(0, state.boss.hp - dmg);
              updateBossUI();
              if (state.boss.hp <= 0) toast(`${state.boss.name} defeated!`);
            }
          }
          for (const color in colorCounts) sfx.match(+color, colorCounts[color]);
          const base = toRemove.size * 10;
          const sizeBonus = Math.max(0, toRemove.size - 3) * 8;
          const createBonus = toConvert.length * 75;
          const triggerBonus = triggered.size * 40;
          const mult = cascadeMultiplier(cascade) * hypeMultiplier();
          const gained = Math.floor((base + sizeBonus + createBonus + triggerBonus) * mult);
          state.score += gained;
          state.juice += toRemove.size;
          state.specialsCreated += toConvert.length;
          if (config.mechanics.hype && cascade >= 2) {
            state.hype.value = Math.min(100, state.hype.value + 18);
            updateHypeUI();
          }
          for (const s of toConvert) {
            const t = grid[s.r][s.c];
            if (t) {
              t.special = s.special;
              renderTile(t);
            }
          }
          showFloat(toRemove, "+" + gained);
          updateHUD();
          renderOverlays();
          const fast = cascade > 5;
          await removeTiles([...toRemove].map((k) => k.split(",").map(Number)), fast);
          await settle(fast);
          await sleep(fast ? 0 : 40);
        }
      }
      function cascadeMultiplier(n) {
        const m = [1, 1.5, 2, 3, 4.5, 7, 10, 15];
        return m[Math.min(n - 1, m.length - 1)];
      }

      /* ================= Environment ================= */
      function applyWeather() {
        if (!state.mutator) return;
        state.mutator.counter++;
        if (state.mutator.counter % state.mutator.freq !== 0) return;
        const kind = state.mutator.kind;
        if (kind === "frostwave") {
          let n = 2,
            guard = 0;
          while (n > 0 && guard < 200) {
            const r = randInt(ROWS),
              c = randInt(COLS);
            const t = grid[r][c];
            guard++;
            if (t && t.frost === 0) {
              t.frost = 2;
              renderFrost(t);
              n--;
            }
          }
          toast("❄ Frost Wave!");
        } else if (kind === "sun") {
          state.score += 120;
          toast("☀ Sun Surge +120");
          updateHUD();
        } else if (kind === "wind") {
          const r = randInt(ROWS);
          const types = [];
          for (let c = 0; c < COLS; c++) types.push(grid[r][c] ? grid[r][c].type : -1);
          const first = types.shift();
          types.push(first);
          for (let c = 0; c < COLS; c++) {
            const t = grid[r][c];
            if (t && types[c] >= 0) {
              t.type = types[c];
              renderTile(t);
            }
          }
          toast("🌬 Wind Gust!");
        }
      }
      function spreadBlight() {
        if (!blightSet.size) return;
        if (state.blightClearedThisTurn) {
          state.blightClearedThisTurn = false;
          return;
        }
        const candidates = [];
        for (const key of blightSet) {
          const [r, c] = key.split(",").map(Number);
          const neigh = [[r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]];
          for (const [nr, nc] of neigh) {
            if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) continue;
            const k = nr + "," + nc;
            if (!blightSet.has(k) && grid[nr][nc]) candidates.push(k);
          }
        }
        if (candidates.length) {
          blightSet.add(candidates[randInt(candidates.length)]);
          renderOverlays();
        }
      }

      /* ================= Hype ================= */
      function updateHypeUI() {
        const wrap = $("hypeWrap");
        if (!wrap) return;

        $("hypeTier").textContent = state.hype.tier + "×";
        $("hypeFill").style.width = state.hype.value + "%";
      }
      function startHypeDecay() {
        clearInterval(hypeTimer);

      }

      /* ================= Boss ================= */

      }

      /* ================= UI: home ================= */
      const LEVELS_PER_PAGE = 20;
      function countryFlag(code) {
        return COUNTRY_BY_CODE[code] ? COUNTRY_BY_CODE[code].flag : "🏳️";
      }
      function seededScore(level, i) {
        const h = Math.sin((level * 97 + i * 131) * 12.9898) * 43758.5453;
        const frac = h - Math.floor(h);
        return Math.floor(700 + frac * 3600 + Math.min(2500, level * 40));
      }
      function buildLeaders(level, tab) {
        const rows = [];

        if (dev) rows.push({ name: state.profile.name, avatar: state.profile.avatar, country: state.profile.country, score: dev.score, ts: dev.ts, me: true });
        if (tab !== "device") {
          SEED_PLAYERS.forEach((p, i) => {
            if (tab === "country" && p.country !== state.profile.country) return;
            rows.push({ name: p.name, avatar: p.avatar, country: p.country, score: seededScore(level, i), ts: null });
          });
        }
        if (!rows.length) return [];
        rows.sort((a, b) => b.score - a.score);
        if (!dev) {
          const me = { name: state.profile.name, avatar: state.profile.avatar, country: state.profile.country, score: 0, ts: null, me: true };
          rows.push(me);
          rows.sort((a, b) => b.score - a.score);
        }
        return rows.slice(0, 8);
      }
      function renderLeaderboard() {

      /* ================= UI: game ================= */
      function missionLabel(g) {

            return state.specialsCreated;
          case "frost":
            return state.frostCleared;
          case "ripen":

      function updateSkillsUI() {

      function initBoard() {

          for (let r = 0; r < ROWS; r++)

                type = spawnType();

      }
      function createsMatchAt(r, c, type) {
        const m = (t) => t && (t.special || t.type === type);
        if (c >= 2 && m(grid[r][c - 1]) && m(grid[r][c - 2])) return true;
        if (r >= 2 && m(grid[r - 1][c]) && m(grid[r - 2][c])) return true;
        if (r >= 1 && c >= 1 && m(grid[r - 1][c - 1]) && m(grid[r - 1][c]) && m(grid[r][c - 1])) return true;
        return false;

          for (let i = cells.length - 1; i > 0; i--) {
            const j = randInt(i + 1);
            [cells[i], cells[j]] = [cells[j], cells[i]];
          }
          for (let i = 0; i < config.frostMin && i < cells.length; i++) {

        while (!hasPossibleMove() && guard < 20) {
          const frozen = [];
          for (let r = 0; r < ROWS; r++)
            for (let c = 0; c < COLS; c++) if (grid[r][c] && grid[r][c].frost > 0) frozen.push(grid[r][c]);

      function showLevelIntro(index) {

      function checkGoals() {

      function calcStars(score, target) {

      function levelComplete() {

      function gameOver() {

      function skipLevel() {

      function postMove() {
        if (state.over) return;

          levelComplete();

        if (state.moves <= 0) {
          gameOver();

        if (!hasPossibleMove()) {

      /* ================= Input ================= */
      function isAdjacent(a, b) {
        return Math.abs(a.r - b.r) + Math.abs(a.c - b.c) === 1;
      }
      function clearSelection() {
        if (state.sel) {
          state.sel.el.classList.remove("sel");
          state.sel = null;
        }
      }
      function swapTiles(a, b) {
        const ar = a.r,
          ac = a.c,
          br = b.r,
          bc = b.c;
        grid[ar][ac] = b;
        grid[br][bc] = a;
        setPos(a, br, bc);
        setPos(b, ar, ac);
      }
      async function doShuffle() {
        const tiles = [];
        for (let r = 0; r < ROWS; r++)
          for (let c = 0; c < COLS; c++) if (grid[r][c]) tiles.push(grid[r][c]);
        let tries = 0;
        do {
          const types = tiles.map((t) => t.type);
          for (let i = types.length - 1; i > 0; i--) {
            const j = randInt(i + 1);
            [types[i], types[j]] = [types[j], types[i]];
          }
          tiles.forEach((t, i) => {
            t.type = types[i];
            renderTile(t);
          });
          tries++;
        } while (hasFruitMatch() && tries < 60);
        tiles.forEach((t) => {
          t.el.classList.add("spin");
          setTimeout(() => t.el.classList.remove("spin"), 420);
        });
        await sleep(state.settings.reduceMotion ? 150 : 380);
      }
      function hasFruitMatch() {
        for (let r = 0; r < ROWS; r++)
          for (let c = 0; c < COLS; c++) {
            const t = grid[r][c];
            if (!t || t.special) continue;
            if (c < COLS - 2 && grid[r][c + 1] && !grid[r][c + 1].special && grid[r][c + 1].type === t.type && grid[r][c + 2] && !grid[r][c + 2].special && grid[r][c + 2].type === t.type) return true;
            if (r < ROWS - 2 && grid[r + 1][c] && !grid[r + 1][c].special && grid[r + 1][c].type === t.type && grid[r + 2][c] && !grid[r + 2][c].special && grid[r + 2][c].type === t.type) return true;
          }
        return false;
      }
      boardEl.addEventListener("pointerdown", (e) => {
        ensureAudio();
        clearHint();
        if (state.busy || state.over) return;
        const el = e.target.closest(".tile");
        if (!el || !el.__tile) return;
        if (state.activeSkill) {
          applySkillTile(el.__tile);
          return;
        }
        drag = { tile: el.__tile, startX: e.clientX, startY: e.clientY, swapped: false, swappedAt: 0, pair: null };
      });
      window.addEventListener("pointermove", (e) => {
        if (!drag || state.busy || state.over || drag.swapped) return;
        const dx = e.clientX - drag.startX,
          dy = e.clientY - drag.startY;
        const t = drag.tile;
        if (t.frost > 0) return;
        const baseX = t.c * (TILE + GAP),
          baseY = t.r * (TILE + GAP);
        let fdx = 0,
          fdy = 0;
        if (Math.abs(dx) > Math.abs(dy)) fdx = clamp(dx, -TILE, TILE);
        else fdy = clamp(dy, -TILE, TILE);
        t.el.style.transform = `translate(${baseX + fdx * 0.7}px, ${baseY + fdy * 0.7}px)`;
        if (Math.abs(dx) > TILE * 0.4 || Math.abs(dy) > TILE * 0.4) {
          let dr = 0,
            dc = 0;
          if (Math.abs(dx) > Math.abs(dy)) dc = sign(dx);
          else dr = sign(dy);
          const nr = t.r + dr,
            nc = t.c + dc;
          if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) return;
          const other = grid[nr][nc];
          if (!other || other.frost > 0) return;
          drag.swapped = true;
          drag.swappedAt = performance.now();
          drag.pair = [t, other];
          swapTiles(t, other);
        }
      });
      window.addEventListener("pointerup", () => {
        if (!drag) return;

        if (state.activeSkill) return;
        if (d.swapped) {
          const elapsed = performance.now() - d.swappedAt;
          finalizeSwap(d.pair[0], d.pair[1], Math.max(0, SWAP_MS - elapsed) + 20);

      window.addEventListener("pointercancel", () => {

      function handleTap(t) {
        if (state.busy || state.over) return;
        if (t.frost > 0) {

        if (state.sel === t) {
          clearSelection();
          return;

        if (state.sel && isAdjacent(state.sel, t)) {
          const a = state.sel;

        state.sel = t;

      async function afterTurn() {
        state.turn++;

            state.gravityTimer = 0;
            const dirs = state.gravityDirs;
            state.gravity = dirs[(dirs.indexOf(state.gravity) + 1) % dirs.length];
            toast("Gravity: " + state.gravity.toUpperCase());
            if (!state.settings.reduceMotion) {
              const deg = { down: 0, up: 180, left: 90, right: -90 }[state.gravity];

      async function finalizeSwap(a, b, waitMs) {

      function accountClears(cells) {

        for (const key of cells) {

          if (blightSet.has(key)) {

      async function resolveRainbow(rainbow, other) {

      /* ================= Skills ================= */
      async function onSkillClick(s, btn) {
        if (state.busy || state.over) return;

        if (state.activeSkill === s.id) {
          state.activeSkill = null;

          return;

        state.juice -= s.cost;

        state.busy = true;

        if (s.id === "hammer") cells.add(t.r + "," + t.c);
        else if (s.id === "burst") {
          for (let dr = -1; dr <= 1; dr++)
            for (let dc = -1; dc <= 1; dc++) {
              const r = t.r + dr,
                c = t.c + dc;
              if (r >= 0 && r < ROWS && c >= 0 && c < COLS) cells.add(r + "," + c);
            }
        } else if (s.id === "row") {
          for (let c = 0; c < COLS; c++) cells.add(t.r + "," + c);
        } else if (s.id === "rainbow") {
          const color = t.type;
          for (let r = 0; r < ROWS; r++)
            for (let c = 0; c < COLS; c++) if (grid[r][c] && grid[r][c].type === color) cells.add(r + "," + c);

        await afterTurn();

        updateHUD();
        postMove();
        scheduleHint();

          ["🌱", "Harvest cells", "Clear a fruit on a glowing sunlit cell to harvest it."],
          ["❄️", "Frosted fruit", "Match on or beside frosted fruit to thaw it; each match removes one layer."],
          ["🌀", "Gravity Tides", "On some levels gravity shifts direction every few moves."],
          ["🕳️", "Portals", "Fruit falling into a portal exits through its pair."],
          ["🔗", "Chain-Link", "Linked cells are destroyed together."],
          ["🌦️", "Weather", "Frost waves, sun surges and wind gusts change the board."],
          ["🦠", "Blight", "Blight spreads unless you clear it on your turn."],
          ["👹", "Boss", "Feed the boss its target fruit to damage it."],
        ]
          .map((m) => `<div class="guide-item"><div class="guide-icon">${m[0]}</div><div><div class="guide-name">${m[1]}</div><div class="guide-desc">${m[2]}</div></div></div>`)
          .join("");
        $("guideList").innerHTML = rows + mech;
      }
      function openGuide() {
        renderGuide();
        openOverlay("guideOverlay");
      }
      function openSettings() {
        $("toggleSound").textContent = state.settings.sound ? "On" : "Off";
        $("toggleMotion").textContent = state.settings.reduceMotion ? "On" : "Off";
        openOverlay("settingsOverlay");
      }
      function closeSettings() {
        closeOverlay("settingsOverlay");
      }
      function toast(msg) {
        const el = $("toast");
        el.textContent = msg;
        el.classList.add("show");
        clearTimeout(toast._t);
        toast._t = setTimeout(() => el.classList.remove("show"), 1700);
      }

      /* ================= Drawer ================= */
      function openDrawer() {
        $("drawer").classList.add("open");
        $("drawerBackdrop").classList.add("show");
      }
      function closeDrawer() {
        $("drawer").classList.remove("open");
        $("drawerBackdrop").classList.remove("show");
      }

      /* ================= Boot ================= */
      loadSave();
      renderSkills();
      updateHomeTop();

      $("profileBtn").addEventListener("click", openProfile);
      $("settingsBtn").addEventListener("click", openSettings);
      $("playBtn").addEventListener("click", () => showLevelIntro(state.level - 1));
      $("prevPage").addEventListener("click", () => {
        if (state.levelPage > 0) {
          state.levelPage--;
          renderLevelGrid();
        }
      });
      $("nextPage").addEventListener("click", () => {
        state.levelPage++;
        renderLevelGrid();
      });
      $("lbTabs").addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        state.lbTab = b.dataset.tab;
        [...$("lbTabs").children].forEach((x) => x.classList.toggle("active", x === b));
        renderLeaderboard();
      });
      $("menuBtn").addEventListener("click", openDrawer);
      $("drawerClose").addEventListener("click", closeDrawer);
      $("drawerBackdrop").addEventListener("click", closeDrawer);
      $("drawerHome").addEventListener("click", () => {
        closeDrawer();
        showHome();
      });
      $("drawerProfile").addEventListener("click", () => {
        closeDrawer();
        openProfile();
      });
      $("drawerGuide").addEventListener("click", () => {
        closeDrawer();
        openGuide();
      });
      $("drawerSettings").addEventListener("click", () => {
        closeDrawer();
        openSettings();
      });
      $("drawerQuit").addEventListener("click", () => {
        closeDrawer();
        if (state.busy) return;
        state.over = true;
        persistSave();
        showHome();
      });
      $("closeSettings").addEventListener("click", closeSettings);
      $("closeGuide").addEventListener("click", () => closeOverlay("guideOverlay"));
      $("closeProfile").addEventListener("click", () => closeOverlay("profileOverlay"));
      $("saveProfile").addEventListener("click", saveProfile);
      $("toggleSound").addEventListener("click", () => {
        state.settings.sound = !state.settings.sound;
        $("toggleSound").textContent = state.settings.sound ? "On" : "Off";
        if (state.settings.sound) sfx.juice();
        persistSave();
      });
      $("toggleMotion").addEventListener("click", () => {
        state.settings.reduceMotion = !state.settings.reduceMotion;
        $("toggleMotion").textContent = state.settings.reduceMotion ? "On" : "Off";
        boardEl.classList.toggle("reduce-motion", state.settings.reduceMotion);
        persistSave();
      });
      $("resetProgress").addEventListener("click", () => {
        if (confirm("Reset all progress? This cannot be undone.")) {
          state.juice = 100;
          state.stars = {};
          state.unlocked = 1;
          state.level = 1;
          state.levelIndex = 0;
          state.leaderboard = { device: {} };
          persistSave();
          closeSettings();
          showHome();
          toast("Progress reset");
          toast("Progress reset");
        }
      });
      $("overlay").addEventListener("click", (e) => {
        if (e.target.id === "overlay") $("overlay").classList.add("hidden");
      });
      let resizeTimer;
      window.addEventListener("resize", () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          if (!$("gameScreen").classList.contains("hidden")) layout();
        }, 120);
      });
      boardEl.addEventListener("touchmove", (e) => {
        if (drag) e.preventDefault();
      }, { passive: false });

      function validateLevelConfig(cfg) {
        const issues = [];
        if (!cfg.palette.length) issues.push("empty palette");
        if (cfg.goals.some((g) => !(g.target > 0))) issues.push("non-positive target");
        const fg = cfg.goals.find((g) => g.type === "frost");
        if (fg && cfg.frostMin < fg.target) issues.push("frost shortfall");
        const rg = cfg.goals.find((g) => g.type === "ripen");
        if (rg && (!cfg.ripenCells || cfg.ripenCells.size < rg.target)) issues.push("ripen shortfall");
        return issues;
      }
      window.OrchardDebug = {
        startLevel,
        generateLevelConfig,
        validateLevelConfig,
        state,
        hasPossibleMove,
        findHintMove,
        swapTiles,
        resolve,
        settle,
        doShuffle,
        getGrid: () => grid,
      };
      if (typeof location !== "undefined" && /[?&]debug=1/.test(location.search)) {
        let bad = 0;
        for (let i = 0; i < 500; i++) {
          const issues = validateLevelConfig(generateLevelConfig(i));
          if (issues.length) {
            bad++;
            console.warn("Level " + (i + 1) + ":", issues.join(", "));
          }
        }
        console.log("Level validation:", bad ? bad + " issues" : "all 500 OK");
      }

      showHome();
    </script>
  </body>
</html>
